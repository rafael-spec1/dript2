<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto | DRIPT</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="logo">DRIPT</a>
    <ul class="menu">
        <li><a href="index.html">INÍCIO</a></li>
        <li><a href="index.html#grid-produtos">COLEÇÕES</a></li>
        <li><a href="sobre.html">SOBRE</a></li>
    </ul>
    <div class="icons">
        <div class="icone-carrinho">
            <span onclick="abrirCarrinho()">🛒</span>
            <div class="contador-carrinho" id="contador">0</div>
        </div>
    </div>
</nav>

<section class="pagina-produto" id="pagina-produto">
</section>

<section class="relacionados">
    <h2>Você também pode gostar</h2>
    <div class="produtos" id="grid-relacionados"></div>
</section>

<!-- CARRINHO LATERAL -->
<div class="carrinho-lateral" id="carrinho">
    <div class="topo-carrinho">
        <h2>Seu Carrinho</h2>
        <span onclick="fecharCarrinho()">✖</span>
    </div>
    <div id="itens-carrinho"></div>
    <div class="rodape-carrinho">
        <h3 id="total-carrinho">Total: R$ 0,00</h3>
        <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
        <button onclick="limparCarrinho()" class="btn-limpar">Limpar Carrinho</button>
    </div>
</div>

<script src="../js/produtos.js"></script>
<script src="../js/produto.js"></script>
<script src="../js/carrinho.js"></script>
<script src="../js/favoritos.js"></script>
<script src="../js/script.js"></script>

<script>
function carregarPaginaProduto() {
    const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));

const produto = Object.values(PRODUTOS).find(p => p.id === id);

    if (!produto) {
        document.getElementById("pagina-produto").innerHTML = "<p>Produto não encontrado.</p>";
        return;
    }

    document.title = produto.nome + " | DRIPT";

    document.getElementById("pagina-produto").innerHTML = `
        <div class="produto-imagem">
    <img src="${produto.imagem}" alt="${produto.nome}">
</div>
        <div class="produto-info">
            <span class="tag">LIMITED</span>
            <div class="titulo-produto">
                <h1>${produto.nome}</h1>
                <button class="btn-favorito" id="btn-fav-detalhe" data-nome="${produto.nome}">🤍</button>
            </div>
            <div class="avaliacao">
                ⭐⭐⭐⭐⭐
                <span>${produto.avaliacao}</span>
            </div>
            <p class="preco">R$ ${produto.preco.toFixed(2).replace(".", ",")}</p>
            <p class="descricao">${produto.descricao}</p>
            <hr>
            <h3>Tamanho</h3>
            <div class="opcoes-tamanho">
                <button onclick="selecionarTamanho(this)">P</button>
                <button onclick="selecionarTamanho(this)" class="ativo">M</button>
                <button onclick="selecionarTamanho(this)">G</button>
                <button onclick="selecionarTamanho(this)">GG</button>
            </div>
            <h3>Quantidade</h3>
            <div class="quantidade">
                <button onclick="diminuirQtd()">−</button>
                <span id="qtd">1</span>
                <button onclick="aumentarQtd()">+</button>
            </div>
            <div class="acoes">
                <button class="btn-comprar" id="btn-comprar-agora">Comprar Agora</button>
                <button class="btn-carrinho" id="btn-add-carrinho">Adicionar ao Carrinho</button>
            </div>
            <div class="beneficios">
                <p>🚚 Frete para todo o Brasil</p>
                <p>🔄 Troca em até 7 dias</p>
                <p>💎 Qualidade Premium</p>
                <p>✔ Produto Original DRIPT</p>
            </div>
        </div>
    `;

    document.getElementById("btn-comprar-agora").onclick = () => {
        adicionarCarrinho(produto.nome, produto.preco);
        finalizarCompra();
    };

    document.getElementById("btn-add-carrinho").onclick = () => {
        adicionarCarrinho(produto.nome, produto.preco);
    };

    document.getElementById("btn-fav-detalhe").onclick = function () {
        favoritarProduto(this, produto.nome, produto.preco, produto.imagem || "");
    };

    // relacionados: todos os outros produtos do catálogo
    let grid = document.getElementById("grid-relacionados");
    grid.innerHTML = Object.values(PRODUTOS)
        .filter(p => p.id !== produto.id)
        .map(p => `
            <a href="produto.html?id=${p.id}" class="link-produto">
                <div class="produto">
                    <img src="${p.imagem}" alt="${p.nome}">
                    <h3>${p.nome}</h3>
                    <p>R$ ${p.preco.toFixed(2).replace(".", ",")}</p>
                </div>
            </a>
        `).join("");
        document.querySelectorAll("#grid-relacionados .produto").forEach(produto => {
    produto.classList.add("aparecer");
});

    if (typeof sincronizarBotoesFavoritos === "function") sincronizarBotoesFavoritos();
}

document.addEventListener("DOMContentLoaded", carregarPaginaProduto);
</script>

</body>
</html>
