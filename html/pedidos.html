<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Pedidos | DRIPT</title>

    <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/conta.css">
</head>

<body class="pagina-cadastro">

    <main class="cadastro">

        <a href="index.html" class="cadastro-logo">
            DRIPT<span>.</span>
        </a>

        <div class="conta-box">

            <div class="cadastro-topo">
                <span>MY DRIPT</span>

                <h1>Meus pedidos</h1>

                <p>
                    Acompanhe seus pedidos realizados na DRIPT.
                </p>
            </div>

            <div id="lista-pedidos"></div>

            <a href="conta.html" class="btn-sobre">
                VOLTAR PARA MINHA CONTA
            </a>

        </div>

    </main>

    <script>
        const lista = document.getElementById("lista-pedidos");
        const escapar = valor => String(valor ?? "").replace(/[&<>"']/g, caractere => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[caractere]);
        fetch("../php/pedidos.php")
            .then(async resposta => {
                const dados = await resposta.json();
                if (resposta.status === 401) {
                    window.location.href = "login.html";
                    return [];
                }
                if (!resposta.ok) throw new Error(dados.mensagem || "Não foi possível carregar os pedidos.");
                return dados;
            })
            .then(pedidos => {
                if (!pedidos.length) {
                    lista.innerHTML = '<p class="sem-pedidos">Você ainda não possui pedidos.</p>';
                    return;
                }
                lista.innerHTML = pedidos.map(pedido => `
                    <div class="pedido">
                        <div>
                            <span>PEDIDO #${pedido.id}</span>
                            <h3>${escapar(pedido.status)}</h3>
                            <p>Data: ${new Date(pedido.criado_em).toLocaleDateString("pt-BR")}</p>
                            <p>Pagamento: ${pedido.metodo_pagamento}</p>
                            <p>Entrega: ${escapar(pedido.endereco)}, ${escapar(pedido.numero)} - ${escapar(pedido.cidade)}</p>
                        </div>
                        <strong>R$ ${(Number(pedido.total_centavos) / 100).toFixed(2).replace(".", ",")}</strong>
                    </div>
                `).join("");
            })
            .catch(erro => lista.textContent = erro.message);
    </script>

</body>

</html>
