<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | DRIPT</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-cadastro">

    <main class="cadastro">

        <a href="index.html" class="cadastro-logo">
    DRIPT<span>.</span>
</a>

        <div class="cadastro-box">

            <div class="cadastro-topo">

                <span>JOIN THE DRIP</span>

                <h1>Crie sua conta</h1>

                <p>
                    Faça parte da DRIPT e acompanhe nossos próximos drops.
                </p>

            </div>

            <form id="form-cadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite sua senha novamente"
                        required
                    >
                </div>

                <label class="termos">
                    <input type="checkbox" id="aceitarTermos">

                    <span>
                        Aceito os termos e condições da DRIPT.
                    </span>
                </label>

                <button type="submit" class="btn-cadastro">
                    CRIAR CONTA
                </button>

            </form>

            <div class="cadastro-login">

                <span>Já possui uma conta?</span>

                <a href="login.html">
                    Entrar
                </a>

            </div>

            <p class="cadastro-privacidade">
                Seus dados são utilizados apenas para sua conta DRIPT.
            </p>

        </div>

    </main>

    <script>

        document
            .getElementById("form-cadastro")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const nome =
                    document.getElementById("nome").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const senha =
                    document.getElementById("senha").value;

                const confirmarSenha =
                    document.getElementById("confirmarSenha").value;

                const termos =
                    document.getElementById("aceitarTermos").checked;


                if (senha !== confirmarSenha) {

                    alert("As senhas não coincidem.");

                    return;
                }


                if (!termos) {

                    alert("Aceite os termos e condições para continuar.");

                    return;
                }


                const usuario = {

                    nome: nome,
                    email: email,
                    senha: senha

                };


                localStorage.setItem(
                    "usuarioDript",
                    JSON.stringify(usuario)
                );


                alert("Conta criada com sucesso!");

                window.location.href = "login.html";

            });

    </script>

</body>

</html>
